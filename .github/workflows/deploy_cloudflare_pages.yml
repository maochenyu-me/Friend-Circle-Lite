name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - page
  workflow_dispatch:
  workflow_call:

env:
  TZ: Asia/Shanghai
  PROJECT_NAME: friend-circle-lite
  PRODUCTION_BRANCH: page

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout page branch
        uses: actions/checkout@v4
        with:
          ref: page

      - name: Ensure Cloudflare Pages project exists
        run: |
          npx wrangler pages project create "$PROJECT_NAME" --production-branch="$PRODUCTION_BRANCH" \
            || echo "Project already exists or cannot be created here; continuing to deploy."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=${{ env.PROJECT_NAME }} --branch=${{ env.PRODUCTION_BRANCH }} --commit-dirty=true
